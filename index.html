<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream & Domain Cloud - Student Tutorial Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col overflow-hidden">

    <!-- App Container -->
    <div id="app" class="flex h-screen w-screen overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all duration-300 z-20">
            <!-- Brand Logo -->
            <div class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-700">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">EduCloud</span>
                        <span class="block text-xs text-slate-400 font-medium">Tutorials & Hosting</span>
                    </div>
                </div>
            </div>

            <!-- Nav Links -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scrollbar">
                <button onclick="appState.switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50" data-tab="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="appState.switchTab('tutorials')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50" data-tab="tutorials">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                    <span>Tutorial Hub</span>
                </button>
                <button onclick="appState.switchTab('upload')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50" data-tab="upload">
                    <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                    <span>Upload Tutorial</span>
                </button>
                <button onclick="appState.switchTab('domain')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50" data-tab="domain">
                    <i data-lucide="globe" class="w-5 h-5"></i>
                    <span>Domain & Hosting</span>
                    <span class="ml-auto bg-brand-100 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 text-xs px-2 py-0.5 rounded-full font-semibold">Live</span>
                </button>
                <button onclick="appState.switchTab('bookmarks')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50" data-tab="bookmarks">
                    <i data-lucide="bookmark" class="w-5 h-5"></i>
                    <span>Bookmarks & Notes</span>
                </button>
            </nav>

            <!-- User Footer Profile & Theme Toggle -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-sm">
                        ST
                    </div>
                    <div>
                        <p class="text-xs font-semibold">Student Portal</p>
                        <p class="text-[10px] text-emerald-500 font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
                        </p>
                    </div>
                </div>
                <button onclick="appState.toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 dark:bg-slate-900">
            <!-- Top Header Bar -->
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10">
                <div class="flex items-center space-x-4">
                    <h1 id="page-title" class="text-xl font-bold tracking-tight text-slate-800 dark:text-white">Dashboard Overview</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="appState.switchTab('upload')" class="flex items-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all hover:shadow-brand-500/25">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>New Tutorial</span>
                    </button>
                    <button onclick="appState.switchTab('domain')" class="flex items-center space-x-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-4 py-2 rounded-xl text-sm font-medium transition-all">
                        <i data-lucide="server" class="w-4 h-4 text-brand-500"></i>
                        <span>Hosting Status</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Tab Views Container -->
            <div id="view-container" class="flex-1 overflow-y-auto custom-scrollbar p-6">
                <!-- Views will be dynamically injected here -->
            </div>
        </main>
    </div>

    <!-- Video Player / Tutorial Modal -->
    <div id="tutorial-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span id="modal-category-badge" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-brand-50 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400">Computer Science</span>
                    <h3 id="modal-title" class="text-lg font-bold truncate max-w-xl">Tutorial Title</h3>
                </div>
                <button onclick="appState.closeModal()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Body (Split Player & Notes) -->
            <div class="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-3">
                <!-- Left: Video / Resource Viewer -->
                <div class="lg:col-span-2 p-6 flex flex-col space-y-4 border-r border-slate-200 dark:border-slate-700">
                    <div id="modal-media-container" class="w-full aspect-video bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center shadow-inner relative">
                        <!-- Embedded Player or Document link -->
                    </div>
                    <div class="space-y-2">
                        <h4 class="font-semibold text-sm">Description</h4>
                        <p id="modal-description" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed"></p>
                    </div>
                    <div class="pt-4 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div id="modal-tags" class="flex flex-wrap gap-2"></div>
                        <button id="modal-bookmark-btn" onclick="appState.toggleBookmarkCurrent()" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700">
                            <i data-lucide="bookmark" class="w-4 h-4"></i>
                            <span id="bookmark-btn-text">Bookmark Tutorial</span>
                        </button>
                    </div>
                </div>

                <!-- Right: Interactive Notes & Discussion -->
                <div class="p-6 flex flex-col h-full bg-slate-50/50 dark:bg-slate-800/50">
                    <h4 class="font-semibold text-sm mb-3 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-brand-500"></i> My Personal Notes
                    </h4>
                    <textarea id="modal-notes-input" placeholder="Type notes for this tutorial here..." class="w-full flex-1 min-h-[160px] p-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"></textarea>
                    <button onclick="appState.saveNotes()" class="mt-3 w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-xl text-sm transition-all shadow-sm">
                        Save Notes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    <!-- Application Logic -->
    <script>
        // Initial Mock Database & State
        class AppState {
            constructor() {
                this.currentTab = 'dashboard';
                this.isDarkMode = false;
                this.searchQuery = '';
                this.selectedCategory = 'All';
                this.activeModalTutorial = null;
                
                // Load or Default Tutorials
                this.tutorials = [
                    {
                        id: 'tut-1',
                        title: 'Advanced React 19 & Tailwind CSS Masterclass',
                        category: 'Web Development',
                        type: 'video',
                        url: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                        fileType: 'YouTube Video',
                        description: 'Comprehensive walkthrough of modern React hooks, server components, and Tailwind styling best practices for scalable web applications.',
                        tags: ['React', 'Tailwind', 'Frontend'],
                        date: '2026-03-28',
                        views: 1240,
                        bookmarked: true,
                        notes: 'Remember to check Server Components documentation.'
                    },
                    {
                        id: 'tut-2',
                        title: 'Data Structures & Algorithms in Python (PDF Guide)',
                        category: 'Computer Science',
                        type: 'document',
                        url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                        fileType: 'PDF Document',
                        description: 'Complete lecture notes covering trees, graphs, sorting algorithms, and complexity analysis with Python code snippets.',
                        tags: ['Python', 'DSA', 'Algorithms'],
                        date: '2026-03-25',
                        views: 890,
                        bookmarked: false,
                        notes: ''
                    },
                    {
                        id: 'tut-3',
                        title: 'Interactive Cloud Architecture & Deployment Portal',
                        category: 'DevOps & Cloud',
                        type: 'link',
                        url: 'https://github.com',
                        fileType: 'External Link',
                        description: 'External GitHub repository with boilerplate configurations for automated CI/CD pipelines and Kubernetes clusters.',
                        tags: ['DevOps', 'Docker', 'Cloud'],
                        date: '2026-03-20',
                        views: 540,
                        bookmarked: false,
                        notes: ''
                    }
                ];

                // Domain & Hosting State
                this.hostingState = {
                    domain: 'studentportal.edu.np',
                    status: 'active', // 'idle', 'searching', 'registering', 'deploying', 'active'
                    hostingPlan: 'Student Free Cloud',
                    deployLogs: [
                        { time: '10:00:12 AM', msg: 'Initialized Git repository and build environment' },
                        { time: '10:00:14 AM', msg: 'Compiled Tailwind CSS bundles successfully' },
                        { time: '10:00:16 AM', msg: 'Provisioned SSL certificate via Let\'s Encrypt' },
                        { time: '10:00:18 AM', msg: 'Deployed to Edge CDN nodes. Domain is live!' }
                    ],
                    searchDomainName: '',
                    searchResults: null
                };
            }

            init() {
                // Check system theme preference
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    this.isDarkMode = true;
                    document.documentElement.classList.add('dark');
                }
                this.updateThemeIcon();
                this.switchTab('dashboard');
            }

            switchTab(tabId) {
                this.currentTab = tabId;
                
                // Update active sidebar buttons
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if(btn.dataset.tab === tabId) {
                        btn.classList.add('bg-brand-50', 'dark:bg-brand-900/30', 'text-brand-600', 'dark:text-brand-400');
                        btn.classList.remove('text-slate-600', 'dark:text-slate-300');
                    } else {
                        btn.classList.remove('bg-brand-50', 'dark:bg-brand-900/30', 'text-brand-600', 'dark:text-brand-400');
                        btn.classList.add('text-slate-600', 'dark:text-slate-300');
                    }
                });

                // Update Header Title
                const titles = {
                    dashboard: 'Dashboard Overview',
                    tutorials: 'Tutorial Hub & Resources',
                    upload: 'Upload New Tutorial',
                    domain: 'Domain Registration & Hosting Manager',
                    bookmarks: 'My Bookmarks & Personal Notes'
                };
                document.getElementById('page-title').textContent = titles[tabId] || 'Portal';

                // Render view
                this.renderView();
                lucide.createIcons();
            }

            toggleDarkMode() {
                this.isDarkMode = !this.isDarkMode;
                if(this.isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                this.updateThemeIcon();
            }

            updateThemeIcon() {
                const icon = document.getElementById('theme-icon');
                if(icon) {
                    icon.setAttribute('data-lucide', this.isDarkMode ? 'sun' : 'moon');
                    lucide.createIcons();
                }
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${
                    type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'
                }`;
                toast.innerHTML = `
                    <i data-lucide="${type === 'success' ? 'check-circle-2' : 'info'}" class="w-5 h-5 flex-shrink-0"></i>
                    <span>${message}</span>
                `;
                container.appendChild(toast);
                lucide.createIcons();

                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                }, 10);

                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            renderView() {
                const container = document.getElementById('view-container');
                container.innerHTML = '';

                switch(this.currentTab) {
                    case 'dashboard':
                        container.innerHTML = this.renderDashboardHTML();
                        break;
                    case 'tutorials':
                        container.innerHTML = this.renderTutorialsHTML();
                        break;
                    case 'upload':
                        container.innerHTML = this.renderUploadHTML();
                        break;
                    case 'domain':
                        container.innerHTML = this.renderDomainHTML();
                        break;
                    case 'bookmarks':
                        container.innerHTML = this.renderBookmarksHTML();
                        break;
                }
                lucide.createIcons();
            }

            renderDashboardHTML() {
                const totalTutorials = this.tutorials.length;
                const totalVideos = this.tutorials.filter(t => t.type === 'video').length;
                const totalDocs = this.tutorials.filter(t => t.type === 'document' || t.type === 'link').length;
                const bookmarkedCount = this.tutorials.filter(t => t.bookmarked).length;

                return `
                    <div class="space-y-6">
                        <!-- Welcome Banner -->
                        <div class="bg-gradient-to-r from-brand-600 to-indigo-500 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                            <div>
                                <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md">Student Cloud v2.4</span>
                                <h2 class="text-2xl font-bold mt-2">Welcome to your Academic Portal & Hosting Hub</h2>
                                <p class="text-brand-100 text-sm mt-1 max-w-2xl">Upload and organize lecture videos, access study materials instantly, or configure your custom domain with 1-click cloud publishing.</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="appState.switchTab('upload')" class="bg-white text-brand-600 hover:bg-brand-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow transition-all">
                                    Upload Material
                                </button>
                                <button onclick="appState.switchTab('domain')" class="bg-brand-700 hover:bg-brand-800 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition-all border border-brand-500/50">
                                    Manage Domain
                                </button>
                            </div>
                        </div>

                        <!-- Stats Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-medium text-slate-400">Total Tutorials</p>
                                    <h3 class="text-2xl font-bold mt-1">${totalTutorials}</h3>
                                    <span class="text-xs text-emerald-500 font-semibold flex items-center mt-1"><i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> +12% this week</span>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 flex items-center justify-center">
                                    <i data-lucide="book-open" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-medium text-slate-400">Video Lessons</p>
                                    <h3 class="text-2xl font-bold mt-1">${totalVideos}</h3>
                                    <span class="text-xs text-blue-500 font-semibold flex items-center mt-1"><i data-lucide="video" class="w-3 h-3 mr-1"></i> HD Streaming</span>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 flex items-center justify-center">
                                    <i data-lucide="play-circle" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-medium text-slate-400">Documents & Links</p>
                                    <h3 class="text-2xl font-bold mt-1">${totalDocs}</h3>
                                    <span class="text-xs text-indigo-500 font-semibold flex items-center mt-1"><i data-lucide="file-text" class="w-3 h-3 mr-1"></i> PDF & Web resources</span>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 flex items-center justify-center">
                                    <i data-lucide="file-text" class="w-6 h-6"></i>
                                </div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-medium text-slate-400">Hosting Status</p>
                                    <h3 class="text-lg font-bold mt-1 text-emerald-500 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Active</h3>
                                    <span class="text-xs text-slate-400 font-medium">${this.hostingState.domain}</span>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center">
                                    <i data-lucide="globe" class="w-6 h-6"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Tutorials Section -->
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-bold">Recent Uploads & Featured Tutorials</h3>
                                <button onclick="appState.switchTab('tutorials')" class="text-sm font-semibold text-brand-600 hover:text-brand-700 dark:text-brand-400 flex items-center gap-1">
                                    View All <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${this.tutorials.slice(0, 3).map(tut => this.renderTutorialCard(tut)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderTutorialsHTML() {
                const categories = ['All', 'Web Development', 'Computer Science', 'DevOps & Cloud', 'Mathematics', 'Database'];
                const filtered = this.tutorials.filter(tut => {
                    const matchesCategory = this.selectedCategory === 'All' || tut.category === this.selectedCategory;
                    const matchesSearch = tut.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                          tut.description.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                          tut.tags.some(tag => tag.toLowerCase().includes(this.searchQuery.toLowerCase()));
                    return matchesCategory && matchesSearch;
                });

                return `
                    <div class="space-y-6">
                        <!-- Filters & Search Bar -->
                        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
                            <!-- Search -->
                            <div class="relative flex-1 max-w-md">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="tutorial-search-input" value="${this.searchQuery}" oninput="appState.handleSearchInput(event)" placeholder="Search tutorials by title, tag, or topic..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <!-- Categories -->
                            <div class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0 custom-scrollbar">
                                ${categories.map(cat => `
                                    <button onclick="appState.selectCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                                        this.selectedCategory === cat 
                                            ? 'bg-brand-600 text-white shadow-sm shadow-brand-500/25' 
                                            : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'
                                    }">
                                        ${cat}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Tutorials Grid -->
                        ${filtered.length === 0 ? `
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-12 text-center space-y-3">
                                <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-2xl mx-auto flex items-center justify-center text-slate-400">
                                    <i data-lucide="folder-search" class="w-8 h-8"></i>
                                </div>
                                <h4 class="font-bold text-base">No tutorials found</h4>
                                <p class="text-sm text-slate-400">Try adjusting your search query or selecting a different category.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${filtered.map(tut => this.renderTutorialCard(tut)).join('')}
                            </div>
                        `}
                    </div>
                `;
            }

            renderTutorialCard(tut) {
                const typeIcons = {
                    video: 'video',
                    document: 'file-text',
                    link: 'external-link'
                };
                return `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col group">
                        <div class="p-5 flex-1 flex flex-col">
                            <div class="flex items-center justify-between mb-3">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400">
                                    ${tut.category}
                                </span>
                                <div class="flex items-center space-x-1">
                                    <button onclick="appState.toggleBookmark('${tut.id}')" class="p-2 text-slate-400 hover:text-amber-500 transition-colors">
                                        <i data-lucide="bookmark" class="w-4 h-4 ${tut.bookmarked ? 'fill-amber-500 text-amber-500' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                            <h4 class="font-bold text-base group-hover:text-brand-600 transition-colors line-clamp-2 mb-2">${tut.title}</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-3 mb-4 flex-1">${tut.description}</p>
                            
                            <div class="flex flex-wrap gap-1.5 mb-4">
                                ${tut.tags.map(t => `<span class="text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-medium">#${t}</span>`).join('')}
                            </div>

                            <div class="pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                                <span class="text-xs text-slate-400 flex items-center gap-1 font-medium">
                                    <i data-lucide="${typeIcons[tut.type] || 'file'}" class="w-3.5 h-3.5"></i> ${tut.fileType}
                                </span>
                                <button onclick="appState.openTutorialModal('${tut.id}')" class="bg-brand-600 hover:bg-brand-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition-all">
                                    Open / Watch
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderUploadHTML() {
                return `
                    <div class="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-8 space-y-6">
                        <div>
                            <h3 class="text-xl font-bold">Upload New Tutorial or Resource</h3>
                            <p class="text-sm text-slate-400 mt-1">Share educational videos, PDF study notes, or reference links with your students.</p>
                        </div>

                        <form id="upload-form" onsubmit="appState.handleUploadSubmit(event)" class="space-y-5">
                            <div class="space-y-1.5">
                                <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Tutorial Title</label>
                                <input type="text" id="up-title" required placeholder="e.g. Advanced TypeScript Generics" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Category</label>
                                    <select id="up-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                        <option value="Web Development">Web Development</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="DevOps & Cloud">DevOps & Cloud</option>
                                        <option value="Mathematics">Mathematics</option>
                                        <option value="Database">Database</option>
                                    </select>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Resource Format</label>
                                    <select id="up-type" onchange="appState.handleFormatChange(event)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                        <option value="video">Video Tutorial (Embed URL or MP4)</option>
                                        <option value="document">Document / PDF</option>
                                        <option value="link">External Link / GitHub</option>
                                    </select>
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                <label id="url-label" class="text-xs font-semibold text-slate-600 dark:text-slate-300">Video Embed URL / YouTube Link</label>
                                <input type="url" id="up-url" required placeholder="https://www.youtube.com/embed/..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>

                            <div class="space-y-1.5">
                                <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Description</label>
                                <textarea id="up-desc" rows="4" required placeholder="Describe what students will learn in this tutorial..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"></textarea>
                            </div>

                            <div class="space-y-1.5">
                                <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Tags (comma separated)</label>
                                <input type="text" id="up-tags" placeholder="react, typescript, frontend" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>

                            <div class="pt-4 flex items-center justify-end space-x-3">
                                <button type="button" onclick="appState.switchTab('tutorials')" class="px-5 py-2.5 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700">Cancel</button>
                                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-md shadow-brand-500/25 transition-all">Publish Tutorial</button>
                            </div>
                        </form>
                    </div>
                `;
            }

            renderDomainHTML() {
                const hs = this.hostingState;
                return `
                    <div class="space-y-6 max-w-5xl mx-auto">
                        <!-- Domain Search Banner -->
                        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-8 shadow-sm space-y-6">
                            <div class="max-w-xl">
                                <span class="bg-brand-50 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 text-xs px-2.5 py-1 rounded-lg font-semibold">Custom Domain Registrar</span>
                                <h3 class="text-xl font-bold mt-2">Register Custom Domain (.edu.np, .com, .org)</h3>
                                <p class="text-sm text-slate-400 mt-1">Search for your institution or personal domain name and bind it instantly to this tutorial portal.</p>
                            </div>

                            <div class="flex flex-col sm:flex-row items-center gap-3">
                                <div class="relative flex-1 w-full">
                                    <i data-lucide="globe" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <input type="text" id="domain-search-input" value="${hs.searchDomainName}" placeholder="e.g. mycollege.edu.np or academy.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                                </div>
                                <button onclick="appState.searchDomain()" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-xl text-sm font-semibold shadow-sm transition-all whitespace-nowrap">
                                    Search Domain
                                </button>
                            </div>

                            <!-- Domain Search Results Box -->
                            ${hs.searchResults ? `
                                <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-between animate-fadeIn">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center">
                                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-sm">${hs.searchResults.name}</h4>
                                            <p class="text-xs text-emerald-500 font-medium">Available! Free student registration included.</p>
                                        </div>
                                    </div>
                                    <button onclick="appState.registerDomain('${hs.searchResults.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-sm transition-all">
                                        Register & Connect
                                    </button>
                                </div>
                            ` : ''}
                        </div>

                        <!-- 1-Click Hosting & Deployment Panel -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <!-- Hosting Status Box -->
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-6 flex flex-col justify-between">
                                <div class="space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h4 class="font-bold text-base">Active Hosting Status</h4>
                                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 dark:bg-emerald-900/40 text-emerald-500 flex items-center gap-1.5">
                                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live
                                        </span>
                                    </div>
                                    <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900 space-y-2 border border-slate-100 dark:border-slate-700">
                                        <p class="text-xs text-slate-400">Primary Domain</p>
                                        <p class="text-sm font-bold text-brand-600 dark:text-brand-400 flex items-center justify-between">
                                            <span>${hs.domain}</span>
                                            <i data-lucide="external-link" class="w-4 h-4 cursor-pointer hover:opacity-75" onclick="appState.showToast('Opening ${hs.domain}...', 'info')"></i>
                                        </p>
                                    </div>
                                    <div class="space-y-1 text-xs text-slate-500">
                                        <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/50">
                                            <span>SSL Certificate</span>
                                            <span class="font-semibold text-emerald-500">Let's Encrypt (Valid)</span>
                                        </div>
                                        <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/50">
                                            <span>CDN Edge Nodes</span>
                                            <span class="font-semibold">Global (Fast)</span>
                                        </div>
                                        <div class="flex justify-between py-1">
                                            <span>Storage Used</span>
                                            <span class="font-semibold">1.4 GB / 50 GB</span>
                                        </div>
                                    </div>
                                </div>

                                <button onclick="appState.triggerRedeploy()" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center justify-center space-x-2">
                                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                    <span>Trigger 1-Click Re-Deploy</span>
                                </button>
                            </div>

                            <!-- Live Deployment Terminal Logs -->
                            <div class="lg:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-sm flex flex-col font-mono text-xs">
                                <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                                        <span class="text-slate-400 ml-2 font-semibold">deployment-stdout.log</span>
                                    </div>
                                    <span class="text-emerald-400 font-bold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ONLINE</span>
                                </div>
                                <div id="terminal-logs" class="flex-1 space-y-2 overflow-y-auto custom-scrollbar text-slate-300 max-h-[260px]">
                                    ${hs.deployLogs.map(log => `
                                        <div class="flex items-start space-x-3">
                                            <span class="text-slate-500">[${log.time}]</span>
                                            <span class="text-emerald-400">➜</span>
                                            <span>${log.msg}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderBookmarksHTML() {
                const bookmarked = this.tutorials.filter(t => t.bookmarked);
                return `
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-xl font-bold">Bookmarked Tutorials & Notes</h3>
                                <p class="text-sm text-slate-400 mt-0.5">Quick access to your saved tutorials and personal study notes.</p>
                            </div>
                            <span class="px-3 py-1 rounded-xl bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 text-xs font-semibold">
                                ${bookmarked.length} Bookmarked
                            </span>
                        </div>

                        ${bookmarked.length === 0 ? `
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-12 text-center space-y-3">
                                <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-2xl mx-auto flex items-center justify-center text-slate-400">
                                    <i data-lucide="bookmark" class="w-8 h-8"></i>
                                </div>
                                <h4 class="font-bold text-base">No bookmarks saved yet</h4>
                                <p class="text-sm text-slate-400">Click the bookmark icon on any tutorial to save it here for later.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${bookmarked.map(tut => this.renderTutorialCard(tut)).join('')}
                            </div>
                        `}
                    </div>
                `;
            }

            // Interactive Actions
            handleSearchInput(e) {
                this.searchQuery = e.target.value;
                this.renderView();
            }

            selectCategory(cat) {
                this.selectedCategory = cat;
                this.renderView();
            }

            toggleBookmark(id) {
                const tut = this.tutorials.find(t => t.id === id);
                if(tut) {
                    tut.bookmarked = !tut.bookmarked;
                    this.showToast(tut.bookmarked ? 'Tutorial bookmarked successfully!' : 'Bookmark removed.', 'success');
                    this.renderView();
                }
            }

            toggleBookmarkCurrent() {
                if(this.activeModalTutorial) {
                    this.toggleBookmark(this.activeModalTutorial.id);
                    // update modal button
                    const btnText = document.getElementById('bookmark-btn-text');
                    if(btnText) {
                        btnText.textContent = this.activeModalTutorial.bookmarked ? 'Bookmarked' : 'Bookmark Tutorial';
                    }
                }
            }

            handleFormatChange(e) {
                const type = e.target.value;
                const label = document.getElementById('url-label');
                const input = document.getElementById('up-url');
                if(type === 'video') {
                    label.textContent = 'Video Embed URL / YouTube Link';
                    input.placeholder = 'https://www.youtube.com/embed/...';
                } else if(type === 'document') {
                    label.textContent = 'Document PDF URL / Cloud Storage Link';
                    input.placeholder = 'https://example.com/syllabus.pdf';
                } else {
                    label.textContent = 'External Link / GitHub / Website URL';
                    input.placeholder = 'https://github.com/my-project';
                }
            }

            handleUploadSubmit(e) {
                e.preventDefault();
                const title = document.getElementById('up-title').value;
                const category = document.getElementById('up-category').value;
                const type = document.getElementById('up-type').value;
                const url = document.getElementById('up-url').value;
                const description = document.getElementById('up-desc').value;
                const tagsRaw = document.getElementById('up-tags').value;
                
                const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : ['General'];
                const fileTypes = { video: 'YouTube Video', document: 'PDF Document', link: 'External Link' };

                const newTut = {
                    id: 'tut-' + Date.now(),
                    title,
                    category,
                    type,
                    url,
                    fileType: fileTypes[type] || 'Resource',
                    description,
                    tags,
                    date: new Date().toISOString().split('T')[0],
                    views: 1,
                    bookmarked: false,
                    notes: ''
                };

                this.tutorials.unshift(newTut);
                this.showToast('Tutorial uploaded and published successfully!', 'success');
                this.switchTab('tutorials');
            }

            openTutorialModal(id) {
                const tut = this.tutorials.find(t => t.id === id);
                if(!tut) return;
                this.activeModalTutorial = tut;

                document.getElementById('modal-title').textContent = tut.title;
                document.getElementById('modal-category-badge').textContent = tut.category;
                document.getElementById('modal-description').textContent = tut.description;
                document.getElementById('bookmark-btn-text').textContent = tut.bookmarked ? 'Bookmarked' : 'Bookmark Tutorial';
                document.getElementById('modal-notes-input').value = tut.notes || '';

                const tagsContainer = document.getElementById('modal-tags');
                tagsContainer.innerHTML = tut.tags.map(t => `<span class="text-xs bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg font-medium">#${t}</span>`).join('');

                const mediaContainer = document.getElementById('modal-media-container');
                if(tut.type === 'video') {
                    mediaContainer.innerHTML = `<iframe src="${tut.url}" class="w-full h-full border-0" allowfullscreen></iframe>`;
                } else {
                    mediaContainer.innerHTML = `
                        <div class="flex flex-col items-center justify-center p-8 text-center space-y-3">
                            <div class="w-16 h-16 bg-brand-50 dark:bg-brand-900/30 text-brand-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="${tut.type === 'document' ? 'file-text' : 'external-link'}" class="w-8 h-8"></i>
                            </div>
                            <h4 class="font-bold text-white">${tut.fileType} Resource</h4>
                            <p class="text-xs text-slate-400 max-w-sm">Click below to open the resource in a new tab or view directly.</p>
                            <a href="${tut.url}" target="_blank" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow transition-all">Open Resource Link</a>
                        </div>
                    `;
                }

                document.getElementById('tutorial-modal').classList.remove('hidden');
                lucide.createIcons();
            }

            closeModal() {
                document.getElementById('tutorial-modal').classList.add('hidden');
                this.activeModalTutorial = null;
            }

            saveNotes() {
                if(this.activeModalTutorial) {
                    const notes = document.getElementById('modal-notes-input').value;
                    this.activeModalTutorial.notes = notes;
                    this.showToast('Personal notes saved successfully!', 'success');
                }
            }

            searchDomain() {
                const query = document.getElementById('domain-search-input').value.trim();
                if(!query) {
                    this.showToast('Please enter a domain name to search.', 'info');
                    return;
                }
                this.hostingState.searchDomainName = query;
                this.hostingState.searchResults = {
                    name: query.includes('.') ? query : query + '.edu.np'
                };
                this.renderView();
                this.showToast('Domain availability verified!', 'success');
            }

            registerDomain(domainName) {
                this.hostingState.domain = domainName;
                this.hostingState.status = 'active';
                const now = new Date().toLocaleTimeString();
                this.hostingState.deployLogs.unshift({
                    time: now,
                    msg: `Successfully registered domain ${domainName} and mapped to CDN`
                });
                this.showToast(`Domain ${domainName} successfully registered & deployed!`, 'success');
                this.renderView();
            }

            triggerRedeploy() {
                const now = new Date().toLocaleTimeString();
                this.hostingState.deployLogs.unshift({
                    time: now,
                    msg: 'Triggered 1-click manual re-deployment across all CDN edge nodes.'
                });
                this.showToast('1-click deployment initiated successfully!', 'success');
                this.renderView();
            }
        }

        // Initialize App on Load
        const appState = new AppState();
        window.onload = () => {
            appState.init();
        };
    </script>
</body>
</html>
